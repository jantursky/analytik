<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b4a7a"/>
      <stop offset="0.55" stop-color="#1a2342"/>
      <stop offset="1" stop-color="#0a0f22"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#5b7bff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#5b7bff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#8cc2ff"/>
      <stop offset="0.35" stop-color="#3A8DFF"/>
      <stop offset="1" stop-color="#1f5fd6"/>
    </linearGradient>
    <linearGradient id="yellow" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#ffe9a0"/>
      <stop offset="0.45" stop-color="#FFC232"/>
      <stop offset="1" stop-color="#e8960c"/>
    </linearGradient>
    <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="256" height="256">
      <rect width="256" height="256" fill="#fff"/>
      <path d="M0 218 L256 62" stroke="#000" stroke-width="16"/>
    </mask>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="26"/>
      <feOffset dy="28"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="9"/>
      <feOffset dy="14"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <g id="shape" mask="url(#cut)" stroke-linejoin="round" stroke-width="12">
      <path d="M128 30 L232 224 L24 224 Z"/>
    </g>
  </defs>

  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  </g>
  <g clip-path="url(#tile)">
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
    <rect x="100" y="100" width="824" height="420" fill="url(#sheen)" opacity="0.5"/>
  </g>
  <rect x="102" y="102" width="820" height="820" rx="183" fill="none" stroke="#fff" stroke-opacity="0.28" stroke-width="3"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="none" stroke="#000" stroke-opacity="0.35" stroke-width="2"/>

  <g transform="translate(228 196) scale(2.2)" filter="url(#soft)">
    <!-- extrusion: stacked darker copies -->
    <g fill="#12408f" stroke="#12408f">
      <use xlink:href="#shape" y="12"/><use xlink:href="#shape" y="10"/><use xlink:href="#shape" y="8"/>
      <use xlink:href="#shape" y="6"/><use xlink:href="#shape" y="4"/><use xlink:href="#shape" y="2"/>
    </g>
    <g mask="url(#cut)" stroke-linejoin="round" stroke-width="12">
      <path d="M128 30 L232 224 L24 224 Z" fill="url(#blue)" stroke="url(#blue)"/>
      <path d="M128 30 L172.5 112.9 L35.3 196.5 Z" fill="url(#yellow)" stroke="url(#yellow)"/>
      <!-- bevel highlights -->
      <path d="M128 24 L238 229" fill="none" stroke="#fff" stroke-opacity="0.0"/>
    </g>
    <path d="M128 31 L172 113" fill="none" stroke="#fff" stroke-opacity="0.55" stroke-width="2.5" stroke-linecap="round" mask="url(#cut)"/>
    <path d="M128 31 L231 223" fill="none" stroke="#fff" stroke-opacity="0.35" stroke-width="2.5" stroke-linecap="round" mask="url(#cut)"/>
  </g>
</svg>
