name: Release

# Pushing a version tag, `1.1.0` or `v1.1.0`, creates the GitHub release with the
# matching CHANGELOG section, then runs every check and publishes that version to npm
# with provenance. The two jobs are independent: a failed publish still leaves the
# GitHub release. Run it by hand with a tag to release a tag pushed earlier.
on:
  push:
    tags: ['[0-9]*', 'v[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release, such as 1.0.0
        required: true

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  github-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
      - name: Tag matches the package version
        run: |
          version=$(node -p "require('./packages/analytik/package.json').version")
          test "${TAG#v}" = "$version" || { echo "Tag $TAG does not match version $version" >&2; exit 1; }
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists"
            exit 0
          fi
          awk -v v="${TAG#v}" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[.*\]: / { exit }
            found { print }
          ' packages/analytik/CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no section for ${TAG#v}" >&2
            exit 1
          fi
          echo "[npm](https://www.npmjs.com/package/analytik/v/${TAG#v})" >> notes.md
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md

  npm:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      # npm trusted publishing and provenance use the workflow's OIDC token.
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5 or newer.
      - run: npm install -g npm@11
      - name: Skip a version that is already on npm
        id: check
        run: |
          version="${TAG#v}"
          test "$version" = "$(node -p "require('./packages/analytik/package.json').version")" ||
            { echo "Tag $TAG does not match package.json" >&2; exit 1; }
          if npm view "analytik@$version" version > /dev/null 2>&1; then
            echo "analytik@$version is already published"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.publish == 'true'
        run: bun install --frozen-lockfile
      - if: steps.check.outputs.publish == 'true'
        run: bunx playwright install --with-deps chromium firefox webkit
      - if: steps.check.outputs.publish == 'true'
        run: bun run check
      - if: steps.check.outputs.publish == 'true'
        run: bun run build
      - if: steps.check.outputs.publish == 'true'
        run: bun run lint:package
      - if: steps.check.outputs.publish == 'true'
        run: bun run test:pack
      - if: steps.check.outputs.publish == 'true'
        run: bun run test:e2e
      - name: Publish to npm
        if: steps.check.outputs.publish == 'true'
        working-directory: packages/analytik
        # The checks above already ran; prepublishOnly would repeat them.
        run: npm publish --provenance --access public --ignore-scripts
