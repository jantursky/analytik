name: Menu bar app

# The Mac app is built and released on its own: the npm package, its checks and its tags are not involved.
on:
  push:
    branches: [main]
    paths: ['apps/menubar/**', '.github/workflows/menubar.yml']
    tags: ['menubar-v*']
  pull_request:
    paths: ['apps/menubar/**', '.github/workflows/menubar.yml']

concurrency:
  group: menubar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  menubar:
    runs-on: macos-15
    permissions:
      contents: write
    defaults:
      run:
        working-directory: apps/menubar
    steps:
      - uses: actions/checkout@v7
      - name: Test
        run: swift test
      - name: Build the app
        run: |
          VERSION=0.0.0-dev
          if [[ "$GITHUB_REF" == refs/tags/menubar-v* ]]; then VERSION="${GITHUB_REF_NAME#menubar-v}"; fi
          scripts/build-app.sh "$VERSION"
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/menubar-v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/*.zip --repo "$GITHUB_REPOSITORY" --title "Menu bar app ${TAG#menubar-v}" \
            --notes "Mac menu bar app. Not notarised yet: right-click, Open the first time." --prerelease
      - name: Update the Homebrew cask
        # Needs a fine-grained token with contents:write on jantursky/homebrew-tap, saved as HOMEBREW_TAP_TOKEN.
        if: startsWith(github.ref, 'refs/tags/menubar-v') && env.TAP_TOKEN != ''
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#menubar-v}"
          SHA="$(shasum -a 256 dist/Analytik-Menu-Bar-$VERSION.zip | cut -d' ' -f1)"
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/jantursky/homebrew-tap.git" "$RUNNER_TEMP/tap"
          mkdir -p "$RUNNER_TEMP/tap/Casks"
          sed -e "s/@VERSION@/$VERSION/" -e "s/@SHA256@/$SHA/" homebrew/analytik-menubar.rb.in > "$RUNNER_TEMP/tap/Casks/analytik-menubar.rb"
          cd "$RUNNER_TEMP/tap"
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add Casks/analytik-menubar.rb
          git commit -m "analytik-menubar $VERSION"
          git push
