name: Menu bar app

# The Mac app is built and released on its own: the npm package, its checks and its tags are not involved.
on:
  push:
    branches: [main]
    paths: ['apps/menubar/**', '.github/workflows/menubar.yml']
    tags: ['menubar-v*']
  pull_request:
    paths: ['apps/menubar/**', '.github/workflows/menubar.yml']

concurrency:
  group: menubar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  menubar:
    runs-on: macos-15
    permissions:
      contents: write
    defaults:
      run:
        working-directory: apps/menubar
    steps:
      - uses: actions/checkout@v7
      - name: Test
        run: swift test
      - name: Build the app
        run: |
          VERSION=0.0.0-dev
          if [[ "$GITHUB_REF" == refs/tags/menubar-v* ]]; then VERSION="${GITHUB_REF_NAME#menubar-v}"; fi
          scripts/build-app.sh "$VERSION"
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/menubar-v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/*.zip --repo "$GITHUB_REPOSITORY" --title "Menu bar app ${TAG#menubar-v}" \
            --notes "Mac menu bar app. Not notarised yet: right-click, Open the first time." --prerelease
